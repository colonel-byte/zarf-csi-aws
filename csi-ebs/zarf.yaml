---
# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: csi-aws-ebs
  # renovate: datasource=helm depName=aws-ebs-csi-driver registryUrl=https://kubernetes-sigs.github.io/aws-ebs-csi-driver
  version: v2.64.0
  source: https://github.com/colonel-byte/zarf-csi-aws
  annotations:
    org.opencontainers.image.source: https://github.com/colonel-byte/zarf-csi-aws
    org.opencontainers.image.description: Zarf package for deploying AWS Cloud Controller Manager
x-charts:
  csi-ebs: []
components:
  - name: csi-ebs-chart
    only:
      flavor: upstream
    charts:
      - name: aws-ebs-csi-driver
        namespace: kube-system
        releaseName: aws-ebs-csi-driver
        noWait: true
        url: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
        # renovate: datasource=helm depName=aws-ebs-csi-driver registryUrl=https://kubernetes-sigs.github.io/aws-ebs-csi-driver
        version: 2.64.0
        valuesFiles:
          - values.yaml
    images:
      - public.ecr.aws/csi-components/csi-attacher:v4.12.0-eksbuild.4
      - public.ecr.aws/csi-components/csi-node-driver-registrar:v2.17.0-eksbuild.4
      - public.ecr.aws/csi-components/csi-provisioner:v6.3.0-eksbuild.3
      - public.ecr.aws/csi-components/csi-resizer:v2.2.1-eksbuild.2
      - public.ecr.aws/csi-components/livenessprobe:v2.19.0-eksbuild.4
      - public.ecr.aws/ebs-csi-driver/aws-ebs-csi-driver:v1.63.1
